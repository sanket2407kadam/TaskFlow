
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TaskFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eff6ff, #f8fafc);
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 36px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(15, 23, 42, .10);
        }

        .brand-icon {
            width: 54px;
            height: 54px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            background: #2563eb;
            border-radius: 15px;
            font-size: 26px;
        }

        .form-control {
            padding: 12px 14px;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 .2rem rgba(37, 99, 235, .12);
        }

        .btn-primary {
            padding: 12px;
            border-radius: 10px;
            background: #2563eb;
            border-color: #2563eb;
            font-weight: 600;
        }

        .btn-primary:hover { background: #1d4ed8; }

        @media (max-width: 480px) {
            .login-card { padding: 25px 20px; }
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="text-center mb-4">
            <div class="brand-icon mb-3">
                <i class="bi bi-check2-square"></i>
            </div>
            <h2 class="fw-bold mb-2">Welcome back!</h2>
            <p class="text-secondary">Log in to continue to TaskFlow.</p>
        </div>

        <div id="message" class="alert d-none" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">
                    Email address
                </label>
                <input type="email" id="email" class="form-control"
                       placeholder="you@example.com"
                       autocomplete="email" required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">
                    Password
                </label>
                <input type="password" id="password" class="form-control"
                       placeholder="Enter your password"
                       autocomplete="current-password" required>
            </div>

            <button type="submit" id="loginButton"
                    class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right me-2"></i>Log In
            </button>
        </form>

        <p class="text-center text-secondary mt-4 mb-0">
            Don't have an account?
            <a href="/register.html"
               class="text-primary fw-semibold text-decoration-none">
                Create account
            </a>
        </p>
    </main>

    <script>
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const loginButton = document.getElementById("loginButton");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "alert alert-" + type;
        }

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Login failed.");
                }

                if (!data.token) {
                    throw new Error("The server did not return an authentication token.");
                }

                // Keep the JWT for this browser tab's session.
                sessionStorage.setItem("taskflowToken", data.token);
                sessionStorage.setItem(
                    "taskflowUser",
                    JSON.stringify(data.user || {})
                );

                showMessage("Login successful! Opening TaskFlow...", "success");

                setTimeout(() => {
                    window.location.href = "/index.html";
                }, 700);

            } catch (error) {
                showMessage(
                    error.message || "Unable to connect to the server.",
                    "danger"
                );
            } finally {
                loginButton.disabled = false;
                loginButton.innerHTML =
                    '<i class="bi bi-box-arrow-in-right me-2"></i>Log In';
            }
        });
    </script>
</body>
</html>
