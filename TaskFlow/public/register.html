
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | TaskFlow</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #09090f;
            --surface: #11111b;
            --surface-light: #181827;
            --border: #29293d;
            --purple: #a855f7;
            --purple-dark: #7c3aed;
            --cyan: #22d3ee;
            --text: #f4f4f8;
            --muted: #9999b2;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 28px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background:
                radial-gradient(ellipse at 15% 15%, rgba(168, 85, 247, .15), transparent 40%),
                radial-gradient(ellipse at 85% 85%, rgba(34, 211, 238, .09), transparent 40%),
                var(--bg);
        }

        .register-card {
            width: 100%;
            max-width: 460px;
            padding: 36px;
            background: rgba(17, 17, 27, .96);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, .4);
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 27px;
            border-radius: 17px;
            background: linear-gradient(135deg, var(--purple), var(--purple-dark));
            box-shadow: 0 8px 30px rgba(168, 85, 247, .25);
        }

        .brand-name {
            color: var(--text);
            font-size: 15px;
            font-weight: 800;
            letter-spacing: -.4px;
        }

        .brand-name span {
            color: var(--cyan);
        }

        .subtitle {
            color: var(--muted);
            font-size: 13px;
        }

        .form-label {
            color: #dedeee;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .form-control {
            min-height: 46px;
            padding: 12px 14px;
            color: var(--text);
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 13px;
        }

        .form-control::placeholder {
            color: #73738d;
        }

        .form-control:focus {
            color: var(--text);
            background: #1c1c2d;
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, .14);
        }

        .password-group {
            position: relative;
        }

        .password-group .form-control {
            padding-right: 48px;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 13px;
            transform: translateY(-50%);
            padding: 4px;
            border: none;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font-size: 17px;
            line-height: 1;
        }

        .password-toggle:hover {
            color: var(--cyan);
        }

        .btn-register {
            min-height: 47px;
            color: #fff;
            background: linear-gradient(100deg, var(--purple-dark), var(--purple));
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            transition: transform .2s, box-shadow .2s;
        }

        .btn-register:hover {
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(168, 85, 247, .25);
        }

        .btn-register:disabled {
            opacity: .65;
            transform: none;
            box-shadow: none;
        }

        .login-link {
            color: var(--cyan);
            font-weight: 600;
            text-decoration: none;
        }

        .login-link:hover {
            color: #a5f3fc;
        }

        .message {
            display: none;
            font-size: 13px;
            border-radius: 10px;
        }

        .alert-success {
            color: #a7f3d0;
            background: rgba(16, 185, 129, .12);
            border: 1px solid rgba(16, 185, 129, .3);
        }

        .alert-danger {
            color: #fca5a5;
            background: rgba(239, 68, 68, .10);
            border: 1px solid rgba(239, 68, 68, .3);
        }

        .security-note {
            color: #77778f;
            font-size: 11px;
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 27px 21px;
            }
        }
    </style>
</head>

<body>
    <main class="register-card">
        <!-- Brand -->
        <div class="text-center mb-4">
            <div class="brand-icon mb-3">
                <i class="bi bi-check2-square"></i>
            </div>

            <div class="brand-name mb-3">
                TASK<span>FLOW</span>
            </div>

            <h2 class="fw-bold mb-2" style="font-size: 25px;">
                Create your account
            </h2>

            <p class="subtitle mb-0">
                Join TaskFlow and organize your work.
            </p>
        </div>

        <!-- API feedback -->
        <div id="message" class="alert message" role="alert"
             aria-live="polite"></div>

        <!-- Registration Form -->
        <form id="registerForm">
            <div class="mb-3">
                <label for="name" class="form-label fw-semibold">
                    Full name
                </label>

                <input
                    type="text"
                    id="name"
                    class="form-control"
                    placeholder="Enter your full name"
                    minlength="2"
                    maxlength="50"
                    autocomplete="name"
                    required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="you@example.com"
                    maxlength="254"
                    autocomplete="email"
                    required>
            </div>

            <!-- Password with Show/Hide -->
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">
                    Password
                </label>

                <div class="password-group">
                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="At least 8 characters"
                        minlength="8"
                        autocomplete="new-password"
                        required>

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="password"
                        aria-label="Show password"
                        aria-pressed="false"
                        title="Show password">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>

                <div class="security-note mt-2">
                    <i class="bi bi-shield-lock me-1"></i>
                    Use at least 8 characters.
                </div>
            </div>

            <!-- Confirm Password with Show/Hide -->
            <div class="mb-4">
                <label for="confirmPassword" class="form-label fw-semibold">
                    Confirm password
                </label>

                <div class="password-group">
                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control"
                        placeholder="Re-enter your password"
                        minlength="8"
                        autocomplete="new-password"
                        required>

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="confirmPassword"
                        aria-label="Show confirm password"
                        aria-pressed="false"
                        title="Show password">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button
                type="submit"
                id="registerButton"
                class="btn btn-register w-100">
                <i class="bi bi-person-plus me-2"></i>Create Account
            </button>
        </form>

        <p class="text-center subtitle mt-4 mb-0">
            Already have an account?
            <a href="/login.html" class="login-link ms-1">
                Log in
            </a>
        </p>

        <div class="text-center security-note mt-4">
            <i class="bi bi-lock me-1"></i>
            Your account is protected by TaskFlow authentication.
        </div>
    </main>

    <script>
        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const button = document.getElementById("registerButton");

        // Show / Hide Password buttons
        document.querySelectorAll(".password-toggle").forEach(function (toggle) {
            toggle.addEventListener("click", function () {
                const targetId = toggle.dataset.target;
                const passwordInput = document.getElementById(targetId);
                const icon = toggle.querySelector("i");

                const isPassword = passwordInput.type === "password";

                passwordInput.type = isPassword ? "text" : "password";
                icon.className = isPassword ? "bi bi-eye-slash" : "bi bi-eye";

                toggle.setAttribute("aria-pressed", String(isPassword));
                toggle.setAttribute(
                    "aria-label",
                    isPassword ? "Hide password" : "Show password"
                );
                toggle.title = isPassword ? "Hide password" : "Show password";
            });
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "alert message alert-" + type;
            message.style.display = "block";
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (name.length < 2) {
                showMessage(
                    "Name must contain at least 2 characters.",
                    "danger"
                );
                return;
            }

            if (password.length < 8) {
                showMessage(
                    "Password must contain at least 8 characters.",
                    "danger"
                );
                return;
            }

            if (password !== confirmPassword) {
                showMessage("Passwords do not match.", "danger");
                return;
            }

            button.disabled = true;
            button.innerHTML =
                '<span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Creating account...';

            try {
                const response = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "Registration failed."
                    );
                }

                showMessage(
                    "Account created successfully! Redirecting to login...",
                    "success"
                );

                form.reset();

                setTimeout(function () {
                    window.location.href = "/login.html";
                }, 1200);

            } catch (error) {
                showMessage(
                    error.message || "Unable to connect to the server.",
                    "danger"
                );
            } finally {
                button.disabled = false;
                button.innerHTML =
                    '<i class="bi bi-person-plus me-2"></i>Create Account';
            }
        });
    </script>
</body>
</html>
