
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | TaskFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eff6ff, #f8fafc);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .register-card {
            width: 100%;
            max-width: 460px;
            padding: 36px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(15, 23, 42, .10);
        }

        .brand-icon {
            width: 54px;
            height: 54px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            background: #2563eb;
            border-radius: 15px;
            font-size: 26px;
        }

        .form-control {
            padding: 12px 14px;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 .2rem rgba(37, 99, 235, .12);
        }

        .btn-primary {
            padding: 12px;
            background: #2563eb;
            border-color: #2563eb;
            border-radius: 10px;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .message { display: none; }

        @media (max-width: 480px) {
            .register-card { padding: 25px 20px; }
        }
    </style>
</head>

<body>
    <main class="register-card">
        <div class="text-center mb-4">
            <div class="brand-icon mb-3">
                <i class="bi bi-check2-square"></i>
            </div>
            <h2 class="fw-bold mb-2">Create your account</h2>
            <p class="text-secondary mb-0">
                Join TaskFlow and organize your work.
            </p>
        </div>

        <div id="message" class="alert message" role="alert"></div>

        <form id="registerForm">
            <div class="mb-3">
                <label for="name" class="form-label fw-semibold">Full name</label>
                <input type="text" id="name" class="form-control"
                       placeholder="Enter your full name"
                       minlength="2" maxlength="50" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email address</label>
                <input type="email" id="email" class="form-control"
                       placeholder="you@example.com" maxlength="254" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input type="password" id="password" class="form-control"
                       placeholder="At least 8 characters"
                       minlength="8" autocomplete="new-password" required>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label fw-semibold">
                    Confirm password
                </label>
                <input type="password" id="confirmPassword" class="form-control"
                       placeholder="Re-enter your password"
                       minlength="8" autocomplete="new-password" required>
            </div>

            <button type="submit" id="registerButton"
                    class="btn btn-primary w-100">
                <i class="bi bi-person-plus me-2"></i>Create Account
            </button>
        </form>

        <p class="text-center text-secondary mt-4 mb-0">
            Already have an account?
            <a href="/login.html" class="text-primary fw-semibold text-decoration-none">
                Log in
            </a>
        </p>
    </main>

    <script>
        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const button = document.getElementById("registerButton");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "alert alert-" + type + " message";
            message.style.display = "block";
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (name.length < 2) {
                showMessage("Name must contain at least 2 characters.", "danger");
                return;
            }

            if (password.length < 8) {
                showMessage("Password must contain at least 8 characters.", "danger");
                return;
            }

            if (password !== confirmPassword) {
                showMessage("Passwords do not match.", "danger");
                return;
            }

            button.disabled = true;
            button.textContent = "Creating account...";

            try {
                const response = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Registration failed.");
                }

                showMessage(
                    "Account created successfully! Redirecting to login...",
                    "success"
                );

                form.reset();

                setTimeout(() => {
                    window.location.href = "/login.html";
                }, 1200);

            } catch (error) {
                showMessage(
                    error.message || "Unable to connect to the server.",
                    "danger"
                );
            } finally {
                button.disabled = false;
                button.innerHTML =
                    '<i class="bi bi-person-plus me-2"></i>Create Account';
            }
        });
    </script>
</body>
</html>
